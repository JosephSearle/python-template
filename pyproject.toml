[project]
name = "python-template"
version = "0.0.0"
description = "Approved starting point for FastAPI HTTP services."
license = "Apache-2.0"
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.162.0",
    "pydantic-settings==2.16.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
# S104 binds to 0.0.0.0, which a container needs.
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
